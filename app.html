<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CosAI-v6</title>
  <link rel="stylesheet" href="app.css" />
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#1a1a2e; }
    #root { width:100%; height:100%; }
    #cosai-dbg {
      position: fixed; left:0; right:0; bottom:0; z-index: 999999;
      background: rgba(0,0,0,.92); color: #7dd3fc;
      font: 10px/1.4 ui-monospace, Menlo, monospace;
      padding: 4px 6px; max-height: 110px; overflow: auto;
      white-space: pre-wrap; word-break: break-all;
      border-top: 1px solid #334155;
      pointer-events: auto;
      transition: max-height .2s ease, padding .2s ease;
    }
    #cosai-dbg.collapsed {
      max-height: 20px;
      padding: 2px 6px;
      overflow: hidden;
      opacity: 0.7;
    }
    #cosai-dbg-toggle {
      position: absolute; top: 2px; right: 6px;
      background: #334155; color: #94a3b8; border: none;
      font-size: 9px; padding: 1px 6px; border-radius: 3px;
      cursor: pointer; z-index: 1;
    }
    #cosai-dbg-toggle:hover { background: #475569; color: #fff; }
    /* AI 测试面板 */
    #cosai-ai-test-panel {
      position: fixed; top: 44px; left: 4px; right: 4px;
      background: rgba(15,15,30,.98); border: 1px solid #4c1d95;
      border-radius: 8px; padding: 12px; z-index: 999997;
      font: 11px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e2e8f0; backdrop-filter: blur(10px);
      display: none;
    }
    #cosai-ai-test-panel h3 {
      margin: 0 0 8px 0; color: #a78bfa; font-size: 13px;
    }
    #cosai-ai-test-panel .row {
      display: flex; gap: 8px; margin-bottom: 8px; align-items: center;
    }
    #cosai-ai-test-panel label {
      min-width: 70px; color: #94a3b8; font-size: 10px;
    }
    #cosai-ai-test-panel input, #cosai-ai-test-panel select {
      flex: 1; background: #1e1e3f; border: 1px solid #334155;
      color: #e2e8f0; padding: 4px 8px; border-radius: 4px;
      font-size: 11px;
    }
    #cosai-ai-test-panel .btn-row {
      display: flex; gap: 6px; margin-top: 8px;
    }
    #cosai-ai-test-panel .btn {
      background: #4c1d95; color: #fff; border: none;
      padding: 5px 12px; border-radius: 4px;
      font-size: 11px; cursor: pointer;
    }
    #cosai-ai-test-panel .btn:hover { background: #6d28d9; }
    #cosai-ai-test-panel .btn.secondary { background: #334155; }
    #cosai-ai-test-panel .btn.secondary:hover { background: #475569; }
    #cosai-ai-test-panel .btn.success { background: #065f46; }
    #cosai-ai-test-panel .btn.success:hover { background: #047857; }
    #cosai-ai-test-panel .result-box {
      margin-top: 8px; padding: 8px; background: #0f0f1e;
      border: 1px solid #334155; border-radius: 4px;
      max-height: 150px; overflow: auto;
      font-family: ui-monospace, Menlo, monospace; font-size: 10px;
      white-space: pre-wrap; word-break: break-all;
    }
    #cosai-ai-test-panel .result-box.success { border-color: #065f46; color: #34d399; }
    #cosai-ai-test-panel .result-box.error { border-color: #991b1b; color: #f87171; }
    #cosai-ai-test-panel .close-btn {
      position: absolute; top: 8px; right: 8px;
      background: none; border: none; color: #64748b;
      font-size: 16px; cursor: pointer; line-height: 1;
    }
    #cosai-ai-test-panel .close-btn:hover { color: #fff; }
    #cosai-toolbox {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999998;
      background: linear-gradient(180deg, rgba(26,26,46,.98), rgba(26,26,46,.9));
      border-bottom: 1px solid #334155;
      padding: 6px 8px;
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      font: 11px/1.3 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      backdrop-filter: blur(8px);
    }
    #cosai-toolbox .tb-title {
      color: #a78bfa; font-weight: 600; font-size: 11px;
      margin-right: 2px;
    }
    #cosai-toolbox .tb-btn {
      background: #4c1d95; color: #fff; border: none;
      padding: 4px 10px; border-radius: 4px;
      font-size: 11px; cursor: pointer;
      transition: background .15s;
    }
    #cosai-toolbox .tb-btn:hover { background: #6d28d9; }
    #cosai-toolbox .tb-btn:active { background: #7c3aed; }
    #cosai-toolbox .tb-btn:disabled {
      background: #374151; color: #6b7280; cursor: not-allowed;
    }
    #cosai-toolbox .tb-status {
      margin-left: auto; color: #9ca3af; font-size: 10px;
      max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #cosai-toolbox .tb-sep {
      width: 1px; height: 16px; background: #334155; margin: 0 2px;
    }
    #root { padding-top: 38px; }
  </style>
  <script>
    // ===== 调试系统（确保 document 未就绪时也能工作）=====
    var __dbgLines = [];
    var __dbgEl = null;
    var __dbgCollapsed = true; // 默认折叠，不遮挡按钮

    function __flushDbg() {
      if (!__dbgEl) {
        var host = document.body || document.documentElement;
        if (!host) return;
        __dbgEl = document.createElement('div');
        __dbgEl.id = 'cosai-dbg';
        // 加折叠按钮
        var toggleBtn = document.createElement('button');
        toggleBtn.id = 'cosai-dbg-toggle';
        toggleBtn.textContent = '展开';
        toggleBtn.onclick = function(e) {
          e.stopPropagation();
          __toggleDbg();
        };
        __dbgEl.appendChild(toggleBtn);
        host.appendChild(__dbgEl);
        // 应用折叠状态
        if (__dbgCollapsed) __dbgEl.classList.add('collapsed');
      }
      // 日志文本放在按钮后面
      var logText = __dbgLines.slice(0, 40).join('\n');
      // 更新文本（保留 toggle 按钮）
      var toggle = __dbgEl.querySelector('#cosai-dbg-toggle');
      __dbgEl.textContent = '';
      if (toggle) __dbgEl.appendChild(toggle);
      __dbgEl.appendChild(document.createTextNode(logText));
    }

    function __toggleDbg() {
      __dbgCollapsed = !__dbgCollapsed;
      if (__dbgEl) {
        if (__dbgCollapsed) {
          __dbgEl.classList.add('collapsed');
        } else {
          __dbgEl.classList.remove('collapsed');
        }
        var btn = __dbgEl.querySelector('#cosai-dbg-toggle');
        if (btn) btn.textContent = __dbgCollapsed ? '展开' : '收起';
      }
      try { localStorage.setItem('cosai_dbg_collapsed', __dbgCollapsed ? '1' : '0'); } catch(e) {}
    }

    // 恢复折叠状态
    try {
      var saved = localStorage.getItem('cosai_dbg_collapsed');
      if (saved === '0') __dbgCollapsed = false;
    } catch(e) {}

    window.__dbg = function (msg) {
      try {
        var t = new Date().toLocaleTimeString() + '.' + String(new Date().getMilliseconds()).padStart(3, '0');
        __dbgLines.unshift('[' + t + '] ' + msg);
        if (__dbgLines.length > 50) __dbgLines.length = 50;
        __flushDbg();
      } catch (e) {}
      // title 同步（panel 端可通过 page-title-updated 观察）
      try { document.title = 'CosAI|' + String(msg).slice(0, 40); } catch (e) {}
    };
    // 如果 DOM 已就绪，立即创建调试条
    if (document.body || document.documentElement) __flushDbg();

    window.__dbg('INIT v6 starting...');

    // ===== PS API 消息桥（webview 端）=====
    (function () {
      var reqId = 0;
      var pending = {};

      var hasUxpHost = typeof window !== 'undefined' &&
        window.uxpHost && typeof window.uxpHost.postMessage === 'function';

      window.__dbg('uxpHost=' + (hasUxpHost ? 'OK' : 'MISSING') +
        ' type=' + (window.uxpHost ? typeof window.uxpHost.postMessage : 'n/a'));

      function extractMessage(e) {
        var raw = undefined;
        var src = '';
        // 优先尝试 e.message（UXP webview 的消息在这里）
        if (e.message !== undefined && e.message !== null && e.message !== '') {
          raw = e.message; src = 'e.message';
        } else if (e.data !== undefined && e.data !== null && e.data !== '') {
          raw = e.data; src = 'e.data';
        } else if (e.detail !== undefined && e.detail !== null) {
          if (typeof e.detail === 'string') { raw = e.detail; src = 'e.detail(str)'; }
          else if (e.detail.data !== undefined) { raw = e.detail.data; src = 'e.detail.data'; }
          else if (e.detail.message !== undefined) { raw = e.detail.message; src = 'e.detail.message'; }
          else { raw = e.detail; src = 'e.detail(obj)'; }
        }
        return { raw: raw, source: src };
      }

      window.addEventListener('message', function (e) {
        var info = extractMessage(e);
        var raw = info.raw;

        if (!raw || raw === '') {
          // 可能是 ping 测试，打日志看看
          var keys = [];
          for (var k in e) { if (e.hasOwnProperty(k) && e[k] !== undefined) keys.push(k); }
          window.__dbg('MSG-EMPTY from=' + info.source + ' keys=' + keys.join(','));
          return;
        }

        window.__dbg('MSG-RCV src=' + info.source +
          ' type=' + typeof raw +
          ' len=' + (typeof raw === 'string' ? raw.length : 'n/a') +
          ' preview=' + String(raw).slice(0, 50));

        var data;
        try {
          data = (typeof raw === 'string') ? JSON.parse(raw) : raw;
        } catch (err) {
          window.__dbg('MSG-PARSE-ERR: ' + err.message);
          return;
        }

        if (!data) return;

        // 处理 panel 发来的 ping 测试
        if (data.type === 'ping') {
          window.__dbg('PING-RCVD from panel: ' + (data.message || ''));
          // 回复 pong（uxpHost 自动序列化，传对象）
          try {
            window.uxpHost.postMessage({
              id: 'pong-' + Date.now(),
              method: '__pong',
              args: [{ message: 'hello from webview', uxpHost: !!window.uxpHost }]
            });
            window.__dbg('PONG-SENT (object)');
          } catch (err) {
            window.__dbg('PONG-SEND-ERR: ' + err.message);
          }
          return;
        }

        // 正常响应处理
        if (typeof data.id !== 'undefined') {
          var p = pending[data.id];
          if (p) {
            if (data.error) {
              window.__dbg('RESP-ERR id=' + data.id + ': ' + String(data.error.message || '').slice(0, 50));
              p.reject(new Error(data.error.message || '操作失败'));
            } else {
              var rlen = data.result && typeof data.result === 'object'
                ? JSON.stringify(data.result).length
                : String(data.result || '').length;
              window.__dbg('RESP-OK id=' + data.id + ' len=' + rlen);
              p.resolve(data.result);
            }
            delete pending[data.id];
          } else {
            window.__dbg('RESP-UNKNOWN id=' + data.id);
          }
        }
      });

      function callHost(method, data) {
        return new Promise(function (resolve, reject) {
          if (!hasUxpHost) {
            reject(new Error('[Bridge] 不在 WebView 环境 (uxpHost missing)'));
            return;
          }
          var id = ++reqId;
          pending[id] = { resolve: resolve, reject: reject };
          setTimeout(function () {
            if (pending[id]) {
              delete pending[id];
              window.__dbg('TIMEOUT ' + method + ' id=' + id);
              reject(new Error('PS API 请求超时: ' + method));
            }
          }, 20000);

          var payload = { id: id, method: method, args: [data || {}] };
          try {
            // uxpHost.postMessage 内部会自动序列化，直接传对象即可
            window.uxpHost.postMessage(payload);
            window.__dbg('SEND ' + method + ' id=' + id + ' (object)');
          } catch (err) {
            window.__dbg('SEND-ERR(obj) ' + method + ': ' + err.message);
            // 回退：尝试字符串形式
            try {
              window.uxpHost.postMessage(JSON.stringify(payload));
              window.__dbg('SEND-OK(str-fallback) ' + method + ' id=' + id);
            } catch (err2) {
              delete pending[id];
              window.__dbg('SEND-ERR(str) ' + method + ': ' + err2.message);
              reject(err2);
            }
          }
        });
      }

      window.__cosai_ps_api = {
        getActiveDocument: function () { return callHost('getDocumentInfo'); },
        getDocuments: function () { return callHost('getDocuments'); },
        getDocumentPixelsAsBase64: function () {
          return callHost('exportAsBase64', { format: 'png' }).then(function (r) {
            var len = r && r.base64 ? r.base64.length : 0;
            window.__dbg('exportAsBase64 ok, b64len=' + len);
            if (r && r.base64) return { base64: r.base64 };
            if (typeof r === 'string') return { base64: r };
            return r || { base64: '' };
          });
        },
        getLayers: function () { return callHost('getAllLayers'); },
        getActiveLayer: function () { return callHost('getActiveLayer'); },
        selectLayer: function (nameOrId) {
          if (typeof nameOrId === 'number') return callHost('selectLayer', { layerId: nameOrId });
          return callHost('getAllLayers').then(function (layers) {
            var found = findLayerByName(layers, nameOrId);
            if (found) return callHost('selectLayer', { layerId: found.id });
            return { success: false };
          });
        },
        pastePixels: function (base64) {
          return callHost('placeLayerFromBase64', { base64: base64, name: 'AI 生成' });
        },
        getSelectionBounds: function () { return callHost('getSelectionBounds'); },
        showAlert: function (m) { window.__dbg('alert: ' + m); return Promise.resolve({ success: true }); },
        undo: function () { return callHost('undo', { steps: 1 }); },
        redo: function () { return callHost('redo', { steps: 1 }); },
        getHistoryStates: function () { return callHost('getHistoryStates'); },
      };

      // ===== React 通信桥接 =====
      // React 用 cosai-webview-message / cosai-host-message 自定义事件通信
      // 但 webview → panel 的 CustomEvent 通道不可靠，所以转成 uxpHost.postMessage
      // 同时把 uxpHost 的响应转成 cosai-host-message 事件回传给 React
      (function bridgeReact() {
        var reactReqMap = {}; // requestId -> 原始请求信息
        var bridged = false;

        function installBridge() {
          if (bridged) return;
          bridged = true;

          // 拦截 React 发出的 cosai-webview-message 事件
          window.addEventListener('cosai-webview-message', function (e) {
            var detail = e.detail || {};
            var type = detail.type;       // 方法名
            var data = detail.data;       // 参数
            var requestId = detail.requestId; // 请求ID

            if (!type || !requestId) return;

            window.__dbg('[BRIDGE] React→Host: ' + type + ' reqId=' + requestId);

            // 方法名映射（如果需要的话）
            var methodMap = {
              'getCanvasAsBase64': 'exportAsBase64',
              'getSelectionAsBase64': 'exportAsBase64', // 需要单独处理选区
              'dodgeBurnLayers': 'dodgeBurnCurves',
            };
            var hostMethod = methodMap[type] || type;

            // 特殊处理：getCanvasAsBase64 格式参数
            var hostData = data || {};
            if (type === 'getCanvasAsBase64' && data && data.format) {
              hostData = { format: data.format, source: 'merged' };
            }

            reactReqMap[requestId] = { type: type, requestId: requestId };

            callHost(hostMethod, hostData)
              .then(function (result) {
                window.__dbg('[BRIDGE] Host→React OK: ' + type + ' reqId=' + requestId);
                // 结果转换
                var respData = result;
                if (type === 'getCanvasAsBase64' && result && result.base64) {
                  respData = { base64: result.base64 };
                }
                dispatchHostMessage('response', {
                  requestId: requestId,
                  success: true,
                  data: respData,
                });
                delete reactReqMap[requestId];
              })
              .catch(function (err) {
                window.__dbg('[BRIDGE] Host→React ERR: ' + type + ' ' + err.message);
                dispatchHostMessage('response', {
                  requestId: requestId,
                  success: false,
                  error: err.message || '操作失败',
                });
                delete reactReqMap[requestId];
              });
          }, true); // capture 阶段拦截，确保最先收到

          window.__dbg('[BRIDGE] React 通信桥已安装');
        }

        function dispatchHostMessage(type, data) {
          var evt = new CustomEvent('cosai-host-message', {
            detail: { type: type, data: data },
          });
          window.dispatchEvent(evt);
        }

        // 立即安装（等 DOM 就绪）
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', installBridge);
        } else {
          installBridge();
        }
        // 延迟再尝试一次，确保 React 加载后也能拦截到
        setTimeout(installBridge, 100);
        setTimeout(installBridge, 500);
      })();

      function findLayerByName(layers, name) {
        if (!layers || !layers.length) return null;
        for (var i = 0; i < layers.length; i++) {
          if (layers[i].name === name) return layers[i];
          if (layers[i].children) { var f = findLayerByName(layers[i].children, name); if (f) return f; }
        }
        return null;
      }
    })();

    // ===== 自动测试 =====
    window.addEventListener('load', function () {
      window.__dbg('PAGE-LOAD event fired');
      setTimeout(function () {
        window.__dbg('AUTO-TEST starting...');
        if (window.__cosai_ps_api && window.__cosai_ps_api.getDocumentPixelsAsBase64) {
          window.__cosai_ps_api.getDocumentPixelsAsBase64()
            .then(function (r) {
              var len = r && r.base64 ? r.base64.length : 0;
              window.__dbg('AUTO-TEST SUCCESS! base64=' + len);
            })
            .catch(function (err) {
              window.__dbg('AUTO-TEST FAIL: ' + (err && err.message));
            });
        } else {
          window.__dbg('AUTO-TEST SKIP: no API');
        }
      }, 2000);
    });

    // DOMContentLoaded 也打个标记
    document.addEventListener('DOMContentLoaded', function () {
      window.__dbg('DOMContentLoaded');
      __flushDbg();
    });

    window.__dbg('SCRIPT parsed, waiting for load');

    window.__cosaiFatal = function (title, detail) {
      var el = document.getElementById('root') || document.body;
      if (el) el.innerHTML = '<div style="padding:16px;color:#f87171;background:#1a1a2e;font-family:sans-serif;font-size:12px;height:100%;overflow:auto;box-sizing:border-box;">'
        + '<div style="margin-bottom:8px;font-weight:bold;">' + title + '</div>'
        + '<pre style="white-space:pre-wrap;word-break:break-all;margin:0;line-height:1.6;">' + String(detail || '').replace(/</g, '&lt;') + '</pre></div>';
    };
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'unknown';
      window.__dbg('FATAL: ' + String(msg).slice(0, 80));
      return true;
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var m = (r && (r.stack || r.message)) || String(r);
      window.__dbg('UNHANDLED-REJ: ' + String(m).slice(0, 80));
    });
  </script>
</head>
<body>
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:#a78bfa;font-family:sans-serif;font-size:14px;">CosAI 加载中...</div>
  </div>

  <!-- 浮动工具箱（顶部） -->
  <div id="cosai-toolbox" style="display:none;">
    <span class="tb-title">CosAI 工具箱</span>
    <button class="tb-btn" id="tb-freq">高低频</button>
    <button class="tb-btn" id="tb-curves">双曲线</button>
    <button class="tb-btn" id="tb-glow">辉光</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" id="tb-getimg" style="background:#0369a1;">获取图片</button>
    <button class="tb-btn" id="tb-result" style="background:#be185d;">✨返图</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" id="tb-aitest" style="background:#047857;">AI测试</button>
    <button class="tb-btn" id="tb-dbg" style="background:#334155;">日志</button>
    <span class="tb-status" id="tb-status">就绪</span>
  </div>

  <!-- 返图区域面板（右侧浮动） -->
  <div id="cosai-result-panel-wrap" style="display:none;position:fixed;top:44px;right:4px;bottom:120px;width:260px;z-index:999997;pointer-events:none;">
    <div id="cosai-result-area" style="pointer-events:auto;"></div>
  </div>

  <!-- AI 连通性测试面板 -->
  <div id="cosai-ai-test-panel">
    <button class="close-btn" id="aitest-close">&times;</button>
    <h3>🔬 AI API 连通性测试</h3>
    <div class="row">
      <label>提供商</label>
      <select id="aitest-provider">
        <option value="grs">GRS（OpenAI 兼容，国内直连）</option>
        <option value="gemini">Gemini（原生格式）</option>
        <option value="openai">OpenAI 兼容格式（通用）</option>
      </select>
    </div>
    <div class="row">
      <label>Base URL</label>
      <input type="text" id="aitest-baseurl" placeholder="https://generativelanguage.googleapis.com/v1beta" />
    </div>
    <div class="row">
      <label>API Key</label>
      <input type="password" id="aitest-apikey" placeholder="输入 API Key" />
    </div>
    <div class="row">
      <label>模型</label>
      <input type="text" id="aitest-model" value="gemini-2.0-flash" />
    </div>
    <div class="row">
      <label>测试类型</label>
      <select id="aitest-type">
        <option value="chat" selected>文字对话（推荐）</option>
        <option value="models">列模型列表</option>
        <option value="vision">图像理解（需要图片）</option>
      </select>
    </div>
    <div class="btn-row">
      <button class="btn success" id="aitest-run">▶ 开始测试</button>
      <button class="btn" id="aitest-credit" style="background:#b45309;">💰 查积分</button>
      <button class="btn secondary" id="aitest-save">💾 保存</button>
      <button class="btn secondary" id="aitest-load">📂 读取</button>
    </div>
    <div class="result-box" id="aitest-result">等待测试...</div>
  </div>

  <!-- 返图区域组件（HHPS 风格） -->
  <script src="风月-返图区域/index.js"></script>

  <script>
    // ===== 工具箱：按钮绑定 =====
    (function() {
      function setStatus(msg) {
        var el = document.getElementById('tb-status');
        if (el) el.textContent = msg;
        window.__dbg('[TB] ' + msg);
      }

      function setBtnLoading(btnId, loading) {
        var btn = document.getElementById(btnId);

            baseUrl: document.getElementById('aitest-baseurl').value,
            apiKey: document.getElementById('aitest-apikey').value,
            model: document.getElementById('aitest-model').value,

          localStorage.setItem('cosai_ai_test_config', JSON.stringify(config));
          setAiResult('配置已保存到 localStorage', 'success');
          window.__dbg('[AI Test] 配置已保存');
        } catch(e) {
          setAiResult('保存失败: ' + e.message, 'error');

      function loadAiConfig() {
        try {
          var saved = localStorage.getItem('cosai_ai_test_config');
          if (saved) {
            var config = JSON.parse(saved);
            if (config.provider) document.getElementById('aitest-provider').value = config.provider;
            if (config.baseUrl) document.getElementById('aitest-baseurl').value = config.baseUrl;
            if (config.apiKey) document.getElementById('aitest-apikey').value = config.apiKey;
            if (config.model) document.getElementById('aitest-model').value = config.model;
            setAiResult('已读取保存的配置', 'success');
            window.__dbg('[AI Test] 配置已读取');
          } else {

            var baseUrlEl = document.getElementById('aitest-baseurl');

              var provider = document.getElementById('aitest-provider').value;
              if (provider === 'gemini') {
                baseUrlEl.value = 'https://generativelanguage.googleapis.com/v1beta';

      // ===== 积分查询 =====
      async function queryCredit() {
        var apiKey = document.getElementById('aitest-apikey').value.trim();
        if (!apiKey) {
          setAiResult('❌ 请先填写 API Key', 'error');
          return;
        }

        setAiResult('⏳ 正在查询积分...', '');
        window.__dbg('[AI Test] 查询积分...');

        try {
          // 尝试多个 GRS 积分查询地址
          var queryUrls = [
            'https://grsapi.xyz/api/query?key=',
            'https://cx.tpkcur.click/api/query?key=',
          ];

          var lastErr = null;
          for (var i = 0; i < queryUrls.length; i++) {
            try {
              var resp = await fetch(queryUrls[i] + encodeURIComponent(apiKey));
              var text = await resp.text();
              if (resp.ok) {
                var data;
                try { data = JSON.parse(text); } catch(e) { data = { raw: text }; }
                // 尝试解析不同的返回格式
                var credit = data.balance || data.credit || data.amount || data.total || (data.data && (data.data.balance || data.data.credit));
                var used = data.used || (data.data && data.data.used);
                var level = data.level || (data.data && data.data.level);
                var expire = data.expire || data.expired_at || (data.data && (data.data.expire || data.data.expired_at));

                var msg = '💰 积分查询结果\n\n';
                if (credit != null) msg += '当前积分: ' + credit + '\n';
                if (used != null) msg += '已使用: ' + used + '\n';
                if (level) msg += '等级: ' + level + '\n';
                if (expire) msg += '到期时间: ' + expire + '\n';
                if (credit == null && used == null && data.raw) {
                  msg += '原始数据:\n' + data.raw.slice(0, 500);
                }
                setAiResult(msg, credit != null ? 'success' : '');
                window.__dbg('[AI Test] 积分查询成功: ' + (credit || '未知'));
                return;
              } else {
                lastErr = 'HTTP ' + resp.status + ': ' + text.slice(0, 200);
              }
            } catch(e) {
              lastErr = e.message;
            }
          }

          // 所有接口都失败了
          setAiResult('❌ 积分查询失败\n\n' +
            '错误: ' + (lastErr || '未知错误') + '\n\n' +
            '可能原因:\n' +
            '• 查询服务暂时不可用\n' +
            '• 网络连接问题\n' +
            '• API Key 格式错误\n\n' +
            '你也可以手动访问以下地址查询:\n' +
            'https://grsapi.xyz/\n' +
            'https://grsai.com/zh/dashboard/', 'error');
          window.__dbg('[AI Test] 积分查询失败: ' + lastErr);
        } catch(e) {
          setAiResult('❌ 积分查询异常: ' + e.message, 'error');
          window.__dbg('[AI Test] 积分查询异常: ' + e.message);
        }
      }

      async function runAiTest() {
        var provider = document.getElementById('aitest-provider').value;
        var baseUrl = document.getElementById('aitest-baseurl').value.trim();
        var apiKey = document.getElementById('aitest-apikey').value.trim();
        var model = document.getElementById('aitest-model').value.trim();
        var testType = document.getElementById('aitest-type').value;

        if (!baseUrl) {
          setAiResult('❌ 请填写 Base URL', 'error');
          return;
        }
        if (!apiKey) {
          setAiResult('❌ 请填写 API Key', 'error');
          return;
        }

        setAiResult('⏳ 正在测试，请稍候...', '');
        window.__dbg('[AI Test] 开始测试: provider=' + provider + ' type=' + testType);

        var startTime = Date.now();

        try {
          var result;

          if (provider === 'gemini') {
            result = await testGemini(baseUrl, apiKey, model, testType);
          } else {
            result = await testOpenAI(baseUrl, apiKey, model, testType);
          }

          var elapsed = Date.now() - startTime;

          if (result.success) {
            var msg = '✅ 测试成功！耗时 ' + elapsed + 'ms\n\n' + result.detail;
            setAiResult(msg, 'success');
            window.__dbg('[AI Test] 成功，耗时 ' + elapsed + 'ms');
          } else {
            var errMsg = '❌ 测试失败\n\n' +
              '错误: ' + result.error + '\n' +
              '状态码: ' + (result.status || 'N/A') + '\n' +
              '耗时: ' + elapsed + 'ms\n\n' +
              '排查建议:\n' +
              (result.status === 401 ? '• API Key 无效或过期\n' : '') +
              (result.status === 403 ? '• API Key 被禁用或区域不支持\n' : '') +
              (result.status === 404 ? '• Base URL 或模型名错误\n' : '') +
              (result.status === 429 ? '• 请求太频繁，配额超限\n' : '') +
              (!result.status ? '• 网络连接失败，请检查代理/VPN\n' : '') +
              (result.status && result.status >= 500 ? '• 服务端错误，稍后重试\n' : '') +
              '\n原始响应:\n' + (result.raw || '');
            setAiResult(errMsg, 'error');
            window.__dbg('[AI Test] 失败: ' + result.error);
          }
        } catch(e) {
          var elapsed2 = Date.now() - startTime;
          var isJsonErr = e.name === 'SyntaxError' || (e.message && e.message.indexOf('JSON') >= 0);
          var errMsg2 = '❌ 测试异常\n\n' +
            '错误: ' + e.message + '\n' +
            '类型: ' + e.name + '\n' +
            '耗时: ' + elapsed2 + 'ms\n\n' +
            '可能原因:\n' +
            (isJsonErr ?
              '• ⚠️ 接口返回的不是 JSON（很可能是 HTML 页面）\n' +
              '  → 换「文字对话」测试类型试试\n' +
              '  → 检查 Base URL 是否正确（有没有多写/少写路径）\n' +
              '  → 该接口可能在此中转站上不存在\n' :
              '• 网络不通（检查代理/VPN）\n' +
              '• Base URL 格式错误\n' +
              '• CORS 跨域限制\n' +
              '• UXP 网络权限问题');
          setAiResult(errMsg2, 'error');
          window.__dbg('[AI Test] 异常: ' + e.message);
        }
      }

      // Gemini 原生格式测试
      async function testGemini(baseUrl, apiKey, model, testType) {
        var url = baseUrl.replace(/\/$/, '');

        if (testType === 'models') {
          // 列模型列表
          var resp = await fetch(url + '/models?key=' + encodeURIComponent(apiKey));
          var text = await resp.text();
          if (!resp.ok) {
            var errJson = {};
            try { errJson = JSON.parse(text); } catch(e) {}
            return {
              success: false,
              error: (errJson.error && errJson.error.message) || ('HTTP ' + resp.status),
              status: resp.status,
              raw: text.slice(0, 500),
            };
          }
          var data = JSON.parse(text);
          var models = (data.models || []).map(function(m) { return m.name; }).slice(0, 10).join('\n');
          return {
            success: true,
            detail: '找到 ' + (data.models ? data.models.length : 0) + ' 个模型\n\n前10个:\n' + models,
          };
        }

        if (testType === 'chat') {
          // 文字对话测试
          var chatUrl = url + '/models/' + model + ':generateContent?key=' + encodeURIComponent(apiKey);
          var resp = await fetch(chatUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ role: 'user', parts: [{ text: '请用一句话介绍你自己' }] }],
            }),
          });
          var text = await resp.text();
          if (!resp.ok) {
            var errJson = {};
            try { errJson = JSON.parse(text); } catch(e) {}
            return {
              success: false,
              error: (errJson.error && errJson.error.message) || ('HTTP ' + resp.status),
              status: resp.status,
              raw: text.slice(0, 500),
            };
          }
          var data = JSON.parse(text);
          var reply = ((data.candidates && data.candidates[0] && data.candidates[0].content &&
            data.candidates[0].content.parts && data.candidates[0].content.parts[0] &&
            data.candidates[0].content.parts[0].text) || '(空响应)');
          var usage = data.usageMetadata ?
            '\n用量: prompt=' + data.usageMetadata.promptTokenCount +
            ', output=' + data.usageMetadata.candidatesTokenCount : '';
          return {
            success: true,
            detail: '模型回复:\n' + reply + usage,
          };
        }

        if (testType === 'vision') {
          // 图像理解测试
          if (!window.__cosai_ps_api) {
            return { success: false, error: 'PS API 未就绪，无法获取图片', status: null, raw: '' };
          }
          setAiResult('⏳ 正在从 PS 获取图片...', '');
          var imgResult = await window.__cosai_ps_api.getDocumentPixelsAsBase64();
          if (!imgResult || !imgResult.base64) {
            return { success: false, error: '获取图片失败', status: null, raw: '' };
          }
          // base64 可能带前缀，去掉
          var b64 = imgResult.base64;
          if (b64.indexOf(',') > 0) b64 = b64.split(',')[1];

          setAiResult('⏳ 正在调用图像理解 API...', '');

          var visionUrl = url + '/models/' + model + ':generateContent?key=' + encodeURIComponent(apiKey);
          var resp = await fetch(visionUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                role: 'user',
                parts: [
                  { text: '简单描述这张图片的内容' },
                  { inline_data: { mime_type: 'image/png', data: b64 } },
                ],
              }],
            }),
          });
          var text = await resp.text();
          if (!resp.ok) {
            var errJson = {};
            try { errJson = JSON.parse(text); } catch(e) {}
            return {
              success: false,
              error: (errJson.error && errJson.error.message) || ('HTTP ' + resp.status),
              status: resp.status,
              raw: text.slice(0, 500),
            };
          }
          var data = JSON.parse(text);
          var reply = ((data.candidates && data.candidates[0] && data.candidates[0].content &&
            data.candidates[0].content.parts && data.candidates[0].content.parts[0] &&
            data.candidates[0].content.parts[0].text) || '(空响应)');
          return {
            success: true,
            detail: '图像理解回复:\n' + reply,
          };
        }

        return { success: false, error: '未知测试类型', status: null, raw: '' };
      }

      // OpenAI 兼容格式测试
      async function testOpenAI(baseUrl, apiKey, model, testType) {
        var url = baseUrl.replace(/\/$/, '');

        if (testType === 'models') {
          var resp = await fetch(url + '/models', {
            headers: { 'Authorization': 'Bearer ' + apiKey },
          });
          var text = await resp.text();
          if (!resp.ok) {
            var errJson = {};
            try { errJson = JSON.parse(text); } catch(e) {}
            return {
              success: false,
              error: (errJson.error && (errJson.error.message || errJson.error)) || ('HTTP ' + resp.status),
              status: resp.status,
              raw: text.slice(0, 500),
            };
          }
          var data = JSON.parse(text);
          var models = (data.data || []).map(function(m) { return m.id; }).slice(0, 10).join('\n');
          return {
            success: true,
            detail: '找到 ' + (data.data ? data.data.length : 0) + ' 个模型\n\n前10个:\n' + models,
          };
        }

        if (testType === 'chat') {
          var chatUrl = url + '/chat/completions';
          var resp = await fetch(chatUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + apiKey,
            },
            body: JSON.stringify({
              model: model,
              messages: [{ role: 'user', content: '请用一句话介绍你自己' }],
              max_tokens: 100,
            }),
          });
          var text = await resp.text();
          if (!resp.ok) {
            var errJson = {};
            try { errJson = JSON.parse(text); } catch(e) {}
            return {
              success: false,
              error: (errJson.error && (errJson.error.message || errJson.error)) || ('HTTP ' + resp.status),
              status: resp.status,
              raw: text.slice(0, 500),
            };
          }
          var data = JSON.parse(text);
          var reply = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '(空响应)';
          var usage = data.usage ?
            '\n用量: prompt=' + data.usage.prompt_tokens + ', output=' + data.usage.completion_tokens : '';
          return {
            success: true,
            detail: '模型回复:\n' + reply + usage,
          };
        }

        if (testType === 'vision') {
          if (!window.__cosai_ps_api) {
            return { success: false, error: 'PS API 未就绪，无法获取图片', status: null, raw: '' };
          }
          setAiResult('⏳ 正在从 PS 获取图片...', '');
          var imgResult = await window.__cosai_ps_api.getDocumentPixelsAsBase64();
          if (!imgResult || !imgResult.base64) {
            return { success: false, error: '获取图片失败', status: null, raw: '' };
          }
          var b64 = imgResult.base64;
          // 确保有前缀
          if (!b64.startsWith('data:')) b64 = 'data:image/png;base64,' + b64;

          setAiResult('⏳ 正在调用图像理解 API...', '');

          var visionUrl = url + '/chat/completions';
          var resp = await fetch(visionUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + apiKey,
            },
            body: JSON.stringify({
              model: model,
              messages: [{
                role: 'user',
                content: [
                  { type: 'text', text: '简单描述这张图片的内容' },
                  { type: 'image_url', image_url: { url: b64 } },
                ],
              }],
              max_tokens: 200,
            }),
          });
          var text = await resp.text();
          if (!resp.ok) {
            var errJson = {};
            try { errJson = JSON.parse(text); } catch(e) {}
            return {
              success: false,
              error: (errJson.error && (errJson.error.message || errJson.error)) || ('HTTP ' + resp.status),
              status: resp.status,
              raw: text.slice(0, 500),
            };
          }
          var data = JSON.parse(text);
          var reply = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '(空响应)';
          return {
            success: true,
            detail: '图像理解回复:\n' + reply,
          };
        }

        return { success: false, error: '未知测试类型', status: null, raw: '' };
      }
    })();

    // ===== 返图区域（参考 HHPS 风格）=====
    (function() {
      var resultArea = null;
      var panelVisible = false;
      var capturedImages = []; // 已捕获的图片 src 列表，避免重复

      function initResultArea() {
        if (resultArea) return;
        var container = document.getElementById('cosai-result-area');
        if (!container || typeof ResultArea === 'undefined') {
          // ResultArea 类还没加载好，等一下
          setTimeout(initResultArea, 200);
          return;
        }

        resultArea = new ResultArea({
          container: container,
          title: '返图区域',
          icon: '✨',
          defaultCollapsed: false,
          onPlace: function(base64, mode) {
            window.__dbg('[ResultArea] 贴回 mode=' + mode + ' len=' + base64.length);
            // 调用 PS API 贴回
            if (mode === 'newLayer') {
              return callHost('placeLayerFromBase64', { base64: base64, name: 'AI 结果' });
            } else {
              // replace 模式：先贴为新图层，用户可以自己调整
              return callHost('placeLayerFromBase64', { base64: base64, name: 'AI 结果' });
            }
          },
          onDownload: function(base64, filename) {
            // 用 UXP 文件系统保存，或者直接下载
            var a = document.createElement('a');
            a.href = base64;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          },
        });

        window.__dbg('[ResultArea] 初始化完成');
      }

      function togglePanel() {
        var wrap = document.getElementById('cosai-result-panel-wrap');
        if (!wrap) return;

        panelVisible = !panelVisible;
        wrap.style.display = panelVisible ? 'block' : 'none';

        var btn = document.getElementById('tb-result');
        if (btn) {
          btn.style.opacity = panelVisible ? '1' : '0.7';
        }

        if (panelVisible && !resultArea) {
          initResultArea();
        }

        window.__dbg('[ResultArea] ' + (panelVisible ? '显示' : '隐藏'));
      }

      // 监听 React 应用的结果面板，自动捕获图片
      function observeResultPanel() {
        var observer = new MutationObserver(function(mutations) {
          if (!resultArea) return;

          // 找结果面板里的图片
          var resultPanel = document.querySelector('.cosai-result-panel__preview-inner img');
          if (resultPanel && resultPanel.src && resultPanel.src.startsWith('data:')) {
            var src = resultPanel.src;
            // 检查是否已经捕获过
            if (capturedImages.indexOf(src) === -1) {
              // 只有在面板打开时才捕获
              var panel = document.querySelector('.cosai-result-panel');
              if (panel && panel.offsetParent !== null) {
                capturedImages.push(src);
                if (capturedImages.length > 50) capturedImages.shift();

                // 找来源信息
                var source = 'AI 生成';
                var titleEl = document.querySelector('.cosai-result-panel__title');
                if (titleEl && titleEl.textContent) {
                  source = titleEl.textContent.trim();
                }

                resultArea.addResult({
                  base64: src,
                  source: source,
                });
                window.__dbg('[ResultArea] 捕获新结果图: ' + source);
              }
            }
          }
        });

        observer.observe(document.body, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ['src'],
        });

        window.__dbg('[ResultArea] DOM 监听已启动');
      }

      // 绑定返图按钮
      function bindResultBtn() {
        var btn = document.getElementById('tb-result');
        if (btn && !btn.__bound) {
          btn.__bound = true;
          btn.addEventListener('click', function() {
            if (!resultArea) initResultArea();
            togglePanel();
          });
        }
      }

      // 初始化
      function tryInit() {
        bindResultBtn();
        // 延迟启动 DOM 监听（等 React 渲染完）
        if (!window.__resultObserverStarted) {
          window.__resultObserverStarted = true;
          setTimeout(observeResultPanel, 3000);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', tryInit);
      } else {
        tryInit();
      }
      setTimeout(tryInit, 500);
      setTimeout(tryInit, 1500);

      // 暴露全局 API，方便调试
      window.__resultArea = {
        show: function() { if (!panelVisible) togglePanel(); },
        hide: function() { if (panelVisible) togglePanel(); },
        addResult: function(opts) {
          if (!resultArea) initResultArea();
          if (!panelVisible) togglePanel();
          return resultArea.addResult(opts);
        },
        setBefore: function(b64) {
          if (resultArea) resultArea.setBeforeImage(b64);
        },
        clear: function() {
          if (resultArea) resultArea.clear();
          capturedImages = [];
        },
        getArea: function() { return resultArea; },
      };
    })();
  </script>

  <script src="app.js"></script>
</body>
</html>
