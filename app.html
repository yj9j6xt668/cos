<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CosAI-v6</title>
  <link rel="stylesheet" href="app.css" />
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#1a1a2e; }
    #root { width:100%; height:100%; }
    #cosai-dbg {
      position: fixed; left:0; right:0; bottom:0; z-index: 999999;
      background: rgba(0,0,0,.92); color: #7dd3fc;
      font: 10px/1.4 ui-monospace, Menlo, monospace;
      padding: 4px 6px; max-height: 110px; overflow: auto;
      white-space: pre-wrap; word-break: break-all;
      border-top: 1px solid #334155;
      pointer-events: none;
    }
    #cosai-toolbox {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999998;
      background: linear-gradient(180deg, rgba(26,26,46,.98), rgba(26,26,46,.9));
      border-bottom: 1px solid #334155;
      padding: 6px 8px;
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      font: 11px/1.3 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      backdrop-filter: blur(8px);
    }
    #cosai-toolbox .tb-title {
      color: #a78bfa; font-weight: 600; font-size: 11px;
      margin-right: 2px;
    }
    #cosai-toolbox .tb-btn {
      background: #4c1d95; color: #fff; border: none;
      padding: 4px 10px; border-radius: 4px;
      font-size: 11px; cursor: pointer;
      transition: background .15s;
    }
    #cosai-toolbox .tb-btn:hover { background: #6d28d9; }
    #cosai-toolbox .tb-btn:active { background: #7c3aed; }
    #cosai-toolbox .tb-btn:disabled {
      background: #374151; color: #6b7280; cursor: not-allowed;
    }
    #cosai-toolbox .tb-status {
      margin-left: auto; color: #9ca3af; font-size: 10px;
      max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #cosai-toolbox .tb-sep {
      width: 1px; height: 16px; background: #334155; margin: 0 2px;
    }
    #root { padding-top: 38px; }
  </style>
  <script>
    // ===== 调试系统（确保 document 未就绪时也能工作）=====
    var __dbgLines = [];
    var __dbgEl = null;
    function __flushDbg() {
      if (!__dbgEl) {
        var host = document.body || document.documentElement;
        if (!host) return;
        __dbgEl = document.createElement('div');
        __dbgEl.id = 'cosai-dbg';
        host.appendChild(__dbgEl);
      }
      __dbgEl.textContent = __dbgLines.slice(0, 40).join('\n');
    }
    window.__dbg = function (msg) {
      try {
        var t = new Date().toLocaleTimeString() + '.' + String(new Date().getMilliseconds()).padStart(3, '0');
        __dbgLines.unshift('[' + t + '] ' + msg);
        if (__dbgLines.length > 50) __dbgLines.length = 50;
        __flushDbg();
      } catch (e) {}
      // title 同步（panel 端可通过 page-title-updated 观察）
      try { document.title = 'CosAI|' + String(msg).slice(0, 40); } catch (e) {}
    };
    // 如果 DOM 已就绪，立即创建调试条
    if (document.body || document.documentElement) __flushDbg();

    window.__dbg('INIT v6 starting...');

    // ===== PS API 消息桥（webview 端）=====
    (function () {
      var reqId = 0;
      var pending = {};

      var hasUxpHost = typeof window !== 'undefined' &&
        window.uxpHost && typeof window.uxpHost.postMessage === 'function';

      window.__dbg('uxpHost=' + (hasUxpHost ? 'OK' : 'MISSING') +
        ' type=' + (window.uxpHost ? typeof window.uxpHost.postMessage : 'n/a'));

      function extractMessage(e) {
        var raw = undefined;
        var src = '';
        // 优先尝试 e.message（UXP webview 的消息在这里）
        if (e.message !== undefined && e.message !== null && e.message !== '') {
          raw = e.message; src = 'e.message';
        } else if (e.data !== undefined && e.data !== null && e.data !== '') {
          raw = e.data; src = 'e.data';
        } else if (e.detail !== undefined && e.detail !== null) {
          if (typeof e.detail === 'string') { raw = e.detail; src = 'e.detail(str)'; }
          else if (e.detail.data !== undefined) { raw = e.detail.data; src = 'e.detail.data'; }
          else if (e.detail.message !== undefined) { raw = e.detail.message; src = 'e.detail.message'; }
          else { raw = e.detail; src = 'e.detail(obj)'; }
        }
        return { raw: raw, source: src };
      }

      window.addEventListener('message', function (e) {
        var info = extractMessage(e);
        var raw = info.raw;

        if (!raw || raw === '') {
          // 可能是 ping 测试，打日志看看
          var keys = [];
          for (var k in e) { if (e.hasOwnProperty(k) && e[k] !== undefined) keys.push(k); }
          window.__dbg('MSG-EMPTY from=' + info.source + ' keys=' + keys.join(','));
          return;
        }

        window.__dbg('MSG-RCV src=' + info.source +
          ' type=' + typeof raw +
          ' len=' + (typeof raw === 'string' ? raw.length : 'n/a') +
          ' preview=' + String(raw).slice(0, 50));

        var data;
        try {
          data = (typeof raw === 'string') ? JSON.parse(raw) : raw;
        } catch (err) {
          window.__dbg('MSG-PARSE-ERR: ' + err.message);
          return;
        }

        if (!data) return;

        // 处理 panel 发来的 ping 测试
        if (data.type === 'ping') {
          window.__dbg('PING-RCVD from panel: ' + (data.message || ''));
          // 回复 pong（uxpHost 自动序列化，传对象）
          try {
            window.uxpHost.postMessage({
              id: 'pong-' + Date.now(),
              method: '__pong',
              args: [{ message: 'hello from webview', uxpHost: !!window.uxpHost }]
            });
            window.__dbg('PONG-SENT (object)');
          } catch (err) {
            window.__dbg('PONG-SEND-ERR: ' + err.message);
          }
          return;
        }

        // 正常响应处理
        if (typeof data.id !== 'undefined') {
          var p = pending[data.id];
          if (p) {
            if (data.error) {
              window.__dbg('RESP-ERR id=' + data.id + ': ' + String(data.error.message || '').slice(0, 50));
              p.reject(new Error(data.error.message || '操作失败'));
            } else {
              var rlen = data.result && typeof data.result === 'object'
                ? JSON.stringify(data.result).length
                : String(data.result || '').length;
              window.__dbg('RESP-OK id=' + data.id + ' len=' + rlen);
              p.resolve(data.result);
            }
            delete pending[data.id];
          } else {
            window.__dbg('RESP-UNKNOWN id=' + data.id);
          }
        }
      });

      function callHost(method, data) {
        return new Promise(function (resolve, reject) {
          if (!hasUxpHost) {
            reject(new Error('[Bridge] 不在 WebView 环境 (uxpHost missing)'));
            return;
          }
          var id = ++reqId;
          pending[id] = { resolve: resolve, reject: reject };
          setTimeout(function () {
            if (pending[id]) {
              delete pending[id];
              window.__dbg('TIMEOUT ' + method + ' id=' + id);
              reject(new Error('PS API 请求超时: ' + method));
            }
          }, 20000);

          var payload = { id: id, method: method, args: [data || {}] };
          try {
            // uxpHost.postMessage 内部会自动序列化，直接传对象即可
            window.uxpHost.postMessage(payload);
            window.__dbg('SEND ' + method + ' id=' + id + ' (object)');
          } catch (err) {
            window.__dbg('SEND-ERR(obj) ' + method + ': ' + err.message);
            // 回退：尝试字符串形式
            try {
              window.uxpHost.postMessage(JSON.stringify(payload));
              window.__dbg('SEND-OK(str-fallback) ' + method + ' id=' + id);
            } catch (err2) {
              delete pending[id];
              window.__dbg('SEND-ERR(str) ' + method + ': ' + err2.message);
              reject(err2);
            }
          }
        });
      }

      window.__cosai_ps_api = {
        getActiveDocument: function () { return callHost('getDocumentInfo'); },
        getDocuments: function () { return callHost('getDocuments'); },
        getDocumentPixelsAsBase64: function () {
          return callHost('exportAsBase64', { format: 'png' }).then(function (r) {
            var len = r && r.base64 ? r.base64.length : 0;
            window.__dbg('exportAsBase64 ok, b64len=' + len);
            if (r && r.base64) return { base64: r.base64 };
            if (typeof r === 'string') return { base64: r };
            return r || { base64: '' };
          });
        },
        getLayers: function () { return callHost('getAllLayers'); },
        getActiveLayer: function () { return callHost('getActiveLayer'); },
        selectLayer: function (nameOrId) {
          if (typeof nameOrId === 'number') return callHost('selectLayer', { layerId: nameOrId });
          return callHost('getAllLayers').then(function (layers) {
            var found = findLayerByName(layers, nameOrId);
            if (found) return callHost('selectLayer', { layerId: found.id });
            return { success: false };
          });
        },
        pastePixels: function (base64) {
          return callHost('placeLayerFromBase64', { base64: base64, name: 'AI 生成' });
        },
        getSelectionBounds: function () { return callHost('getSelectionBounds'); },
        showAlert: function (m) { window.__dbg('alert: ' + m); return Promise.resolve({ success: true }); },
        undo: function () { return callHost('undo', { steps: 1 }); },
        redo: function () { return callHost('redo', { steps: 1 }); },
        getHistoryStates: function () { return callHost('getHistoryStates'); },
      };

      function findLayerByName(layers, name) {
        if (!layers || !layers.length) return null;
        for (var i = 0; i < layers.length; i++) {
          if (layers[i].name === name) return layers[i];
          if (layers[i].children) { var f = findLayerByName(layers[i].children, name); if (f) return f; }
        }
        return null;
      }
    })();

    // ===== 自动测试 =====
    window.addEventListener('load', function () {
      window.__dbg('PAGE-LOAD event fired');
      setTimeout(function () {
        window.__dbg('AUTO-TEST starting...');
        if (window.__cosai_ps_api && window.__cosai_ps_api.getDocumentPixelsAsBase64) {
          window.__cosai_ps_api.getDocumentPixelsAsBase64()
            .then(function (r) {
              var len = r && r.base64 ? r.base64.length : 0;
              window.__dbg('AUTO-TEST SUCCESS! base64=' + len);
            })
            .catch(function (err) {
              window.__dbg('AUTO-TEST FAIL: ' + (err && err.message));
            });
        } else {
          window.__dbg('AUTO-TEST SKIP: no API');
        }
      }, 2000);
    });

    // DOMContentLoaded 也打个标记
    document.addEventListener('DOMContentLoaded', function () {
      window.__dbg('DOMContentLoaded');
      __flushDbg();
    });

    window.__dbg('SCRIPT parsed, waiting for load');

    window.__cosaiFatal = function (title, detail) {
      var el = document.getElementById('root') || document.body;
      if (el) el.innerHTML = '<div style="padding:16px;color:#f87171;background:#1a1a2e;font-family:sans-serif;font-size:12px;height:100%;overflow:auto;box-sizing:border-box;">'
        + '<div style="margin-bottom:8px;font-weight:bold;">' + title + '</div>'
        + '<pre style="white-space:pre-wrap;word-break:break-all;margin:0;line-height:1.6;">' + String(detail || '').replace(/</g, '&lt;') + '</pre></div>';
    };
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'unknown';
      window.__dbg('FATAL: ' + String(msg).slice(0, 80));
      return true;
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var m = (r && (r.stack || r.message)) || String(r);
      window.__dbg('UNHANDLED-REJ: ' + String(m).slice(0, 80));
    });
  </script>
</head>
<body>
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:#a78bfa;font-family:sans-serif;font-size:14px;">CosAI 加载中...</div>
  </div>

  <!-- 浮动工具箱（顶部） -->
  <div id="cosai-toolbox" style="display:none;">
    <span class="tb-title">CosAI 工具箱</span>
    <button class="tb-btn" id="tb-freq">高低频</button>
    <button class="tb-btn" id="tb-curves">双曲线</button>
    <button class="tb-btn" id="tb-glow">辉光</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" id="tb-getimg" style="background:#0369a1;">获取图片</button>
    <span class="tb-status" id="tb-status">就绪</span>
  </div>

  <script>
    // ===== 工具箱：按钮绑定 =====
    (function() {
      function setStatus(msg) {
        var el = document.getElementById('tb-status');
        if (el) el.textContent = msg;
        window.__dbg('[TB] ' + msg);
      }

      function setBtnLoading(btnId, loading) {
        var btn = document.getElementById(btnId);
        if (btn) {
          btn.disabled = loading;
          btn.style.opacity = loading ? '0.6' : '1';
        }
      }

      function bindToolbox() {
        var tb = document.getElementById('cosai-toolbox');
        if (!tb) return;
        tb.style.display = 'flex';

        // 高低频分离
        var btnFreq = document.getElementById('tb-freq');
        if (btnFreq && !btnFreq.__bound) {
          btnFreq.__bound = true;
          btnFreq.addEventListener('click', function() {
            setStatus('高低频处理中...');
            setBtnLoading('tb-freq', true);
            callHost('frequencySeparation', { radius: 8 })
              .then(function(r) {
                setStatus('高低频完成 ✓');
                setTimeout(function(){ setStatus('就绪'); }, 2000);
              })
              .catch(function(err) {
                setStatus('高低频失败: ' + err.message);
              })
              .finally(function() {
                setBtnLoading('tb-freq', false);
              });
          });
        }

        // 双曲线修图
        var btnCurves = document.getElementById('tb-curves');
        if (btnCurves && !btnCurves.__bound) {
          btnCurves.__bound = true;
          btnCurves.addEventListener('click', function() {
            setStatus('双曲线创建中...');
            setBtnLoading('tb-curves', true);
            callHost('dodgeBurnCurves', { dodgeAmount: 25, burnAmount: 25 })
              .then(function(r) {
                setStatus('双曲线完成 ✓');
                setTimeout(function(){ setStatus('就绪'); }, 2000);
              })
              .catch(function(err) {
                setStatus('双曲线失败: ' + err.message);
              })
              .finally(function() {
                setBtnLoading('tb-curves', false);
              });
          });
        }

        // 辉光效果
        var btnGlow = document.getElementById('tb-glow');
        if (btnGlow && !btnGlow.__bound) {
          btnGlow.__bound = true;
          btnGlow.addEventListener('click', function() {
            setStatus('辉光处理中...');
            setBtnLoading('tb-glow', true);
            callHost('glowEffect', { radius: 20, opacity: 50, blendMode: 'screen' })
              .then(function(r) {
                setStatus('辉光完成 ✓');
                setTimeout(function(){ setStatus('就绪'); }, 2000);
              })
              .catch(function(err) {
                setStatus('辉光失败: ' + err.message);
              })
              .finally(function() {
                setBtnLoading('tb-glow', false);
              });
          });
        }

        // 获取图片
        var btnImg = document.getElementById('tb-getimg');
        if (btnImg && !btnImg.__bound) {
          btnImg.__bound = true;
          btnImg.addEventListener('click', function() {
            setStatus('获取图片中...');
            setBtnLoading('tb-getimg', true);
            callHost('exportAsBase64', { format: 'png', source: 'merged' })
              .then(function(r) {
                setStatus('图片已获取 (' + (r.base64?.length || 0) + ' 字节)');
                // 把 base64 发给 panel 显示或者做其他处理
                setTimeout(function(){ setStatus('就绪'); }, 2000);
              })
              .catch(function(err) {
                setStatus('获取失败: ' + err.message);
              })
              .finally(function() {
                setBtnLoading('tb-getimg', false);
              });
          });
        }
      }

      // 页面加载后绑定，并持续重试（等 React 渲染完成后 DOM 稳定）
      function tryBind() {
        bindToolbox();
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', tryBind);
      } else {
        tryBind();
      }
      // 额外再尝试几次，确保 DOM 完全就绪
      setTimeout(tryBind, 500);
      setTimeout(tryBind, 1500);
      setTimeout(tryBind, 3000);
    })();
  </script>

  <script src="app.js"></script>
</body>
</html>
